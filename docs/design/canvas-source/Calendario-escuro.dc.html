body{margin:0}

button{font-family:inherit}
.tap{transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease,background-color .3s ease,color .3s ease,border-color .3s ease}
.tap:hover{transform:translateY(-1px)}
.tap:active{transform:translate(2px,2px) scale(.99)}
.tap:focus-visible,input:focus-visible{outline:2px solid #FF4B00;outline-offset:3px}
.fu{animation:fu .6s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes fu{from{opacity:0;transform:translateY(10px)}}
.fade{animation:fade .6s ease .25s backwards}
@keyframes fade{from{opacity:0}}
.seg{animation:draw .8s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes draw{from{stroke-dasharray:0 400}}
.grow{transform-origin:bottom;animation:grow .85s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes grow{from{transform:scaleY(0)}}
.pop{animation:pop .5s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
.up{animation:up .55s cubic-bezier(.2,.8,.2,1) .3s backwards}
@keyframes up{from{opacity:0;transform:translateY(24px)}}
.sheet{animation:sheet .6s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes sheet{from{transform:translateY(100%)}}
.veil{animation:fade .4s ease backwards}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
