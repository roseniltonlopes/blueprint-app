# Verifica cada push e pull request na main: tipos, lint e testes automatizados.
name: Verificação

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verificar:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # O Expo SDK 57 exige Node 20 ou mais novo.
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4
      - name: Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Testes
        run: npm test -- --ci
